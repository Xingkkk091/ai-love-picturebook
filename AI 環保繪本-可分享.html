<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>AI 環保繪本 · 把小朋友的故事畫出來</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1a2233;
    --ink-2: #4a5568;
    --paper: #fffaf0;
    --paper-2: #fff3dc;
    --leaf: #4a9d5f;
    --leaf-light: #d4ecd9;
    --sky: #5ab4d4;
    --sky-light: #cbe7f0;
    --sun: #f5b942;
    --sun-light: #fce5b0;
    --tomato: #e85d4f;
    --tomato-light: #fbd7d0;
    --hand: 'Zen Maru Gothic', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #f0e6d2; font-family: var(--hand); color: var(--ink); }
  body {
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 20% 10%, #fff8e3 0%, transparent 40%),
      radial-gradient(circle at 80% 90%, #e8f3da 0%, transparent 40%),
      linear-gradient(180deg, #fbf3df 0%, #efe6d0 100%);
  }

  .stage { max-width: 1200px; margin: 0 auto; padding: 24px 28px 64px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px; background: var(--ink); color: var(--paper);
    border-radius: 18px 18px 0 0; border: 3px solid var(--ink); border-bottom: none;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 38px; height: 38px; background: var(--leaf); border-radius: 10px; display: grid; place-items: center; font-size: 22px; border: 2px solid var(--paper); }
  .topbar h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .topbar .sub { font-family: var(--mono); font-size: 11px; opacity: 0.7; letter-spacing: 0.06em; }
  .topbar .right { display: flex; gap: 10px; align-items: center; font-family: var(--mono); font-size: 11px; opacity: 0.85; }
  .pulse { width: 8px; height: 8px; background: var(--leaf); border-radius: 50%; animation: pulse 2s infinite; }
  .pulse.off { background: var(--tomato); animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.4); } }
  .topbar .right button {
    background: transparent; color: inherit; border: 1px solid rgba(255,255,255,0.3);
    border-radius: 6px; padding: 4px 9px; font-family: var(--mono); font-size: 11px;
    cursor: pointer; letter-spacing: 0.04em;
  }
  .topbar .right button:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.6); }

  .stepper { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--paper); border-left: 3px solid var(--ink); border-right: 3px solid var(--ink); }
  .step { padding: 16px 14px; text-align: center; cursor: pointer; border-right: 2px dashed rgba(26,34,51,0.18); user-select: none; transition: background 0.15s; }
  .step:last-child { border-right: none; }
  .step .num { display: inline-block; width: 26px; height: 26px; border-radius: 50%; background: var(--paper-2); border: 2px solid var(--ink); line-height: 22px; font-weight: 700; margin-bottom: 6px; font-family: var(--mono); font-size: 13px; }
  .step .name { font-size: 16px; font-weight: 700; }
  .step .desc { font-size: 11px; color: var(--ink-2); margin-top: 2px; font-family: var(--mono); }
  .step.active { background: var(--paper-2); }
  .step.active .num { background: var(--leaf); color: var(--paper); }
  .step.done .num { background: var(--ink); color: var(--paper); }
  .step.done .num::before { content: '✓'; }
  .step.done .num span { display: none; }

  .body { background: var(--paper); border: 3px solid var(--ink); border-top: none; border-radius: 0 0 18px 18px; padding: 32px; min-height: 540px; }
  .head { margin-bottom: 22px; padding-bottom: 16px; border-bottom: 2px dashed rgba(26,34,51,0.15); display: flex; justify-content: space-between; gap: 24px; }
  .head h2 { font-size: 28px; margin: 0 0 6px; font-weight: 900; }
  .head .lede { font-size: 14px; color: var(--ink-2); max-width: 540px; line-height: 1.5; }
  .teacher-note { font-family: var(--mono); font-size: 10px; background: var(--ink); color: var(--paper); padding: 6px 10px; border-radius: 4px; max-width: 240px; line-height: 1.5; flex-shrink: 0; }
  .teacher-note::before { content: '老師備忘'; display: block; font-size: 9px; opacity: 0.6; letter-spacing: 0.1em; margin-bottom: 3px; }

  h3.label-h { font-size: 13px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-2); margin: 0 0 10px; }
  h3.label-h em { font-style: normal; background: var(--leaf); color: var(--paper); padding: 1px 6px; border-radius: 3px; margin-right: 6px; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 8px 14px; border: 2px solid var(--ink); background: var(--paper-2); border-radius: 999px; font-family: var(--hand); font-size: 14px; cursor: pointer; transition: all 0.12s; }
  .chip:hover { transform: translate(-1px, -1px); box-shadow: 2px 2px 0 var(--ink); }
  .chip.selected { background: var(--leaf); color: var(--paper); }
  .chip.selected.tone-rose { background: var(--tomato); }
  .chip.selected.tone-sky { background: var(--sky); }
  .chip.selected.tone-sun { background: var(--sun); color: var(--ink); }

  textarea, input[type="text"] { width: 100%; padding: 14px; border: 2px solid var(--ink); border-radius: 12px; font-family: var(--hand); font-size: 16px; background: var(--paper); resize: vertical; }
  textarea:focus, input:focus { outline: none; box-shadow: 0 0 0 3px var(--leaf); }

  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 32px; }
  .btn { padding: 14px 22px; border: 3px solid var(--ink); border-radius: 12px; font-family: var(--hand); font-size: 16px; font-weight: 700; cursor: pointer; background: var(--paper); box-shadow: 3px 3px 0 var(--ink); transition: transform 0.1s; }
  .btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: 3px 3px 0 var(--ink); }
  .btn.primary { background: var(--leaf); color: var(--paper); }
  .btn.big { padding: 18px 34px; font-size: 19px; }

  .lesson-box { margin-top: 18px; padding: 14px 18px; background: var(--sun-light); border: 2px solid var(--ink); border-radius: 12px; font-size: 14px; line-height: 1.6; }
  .lesson-box::before { content: '💡 給小朋友的小知識'; display: block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; margin-bottom: 6px; opacity: 0.7; }
  .lesson-box.warn { background: var(--tomato-light); }

  .footer-tip { margin-top: 14px; text-align: center; font-family: var(--mono); font-size: 10px; color: var(--ink-2); letter-spacing: 0.1em; }
  .footer-tip span { background: var(--ink); color: var(--paper); padding: 2px 6px; border-radius: 3px; margin: 0 4px; }

  .thinking { text-align: center; padding: 60px 20px; color: var(--ink-2); }
  .thinking-dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--leaf); margin: 0 4px; animation: bounce 1.2s infinite ease-in-out; }
  .thinking-dot:nth-child(2) { animation-delay: 0.15s; }
  .thinking-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-12px); } }

  /* ── Step 1: story input ───────────────────── */
  .story-tools { display: grid; grid-template-columns: 280px 1fr; gap: 24px; }
  @media (max-width: 800px) { .story-tools { grid-template-columns: 1fr; } }
  .seed-list { display: flex; flex-direction: column; gap: 8px; }
  .seed-list button {
    text-align: left; padding: 12px 14px; background: var(--paper-2); border: 2px solid var(--ink);
    border-radius: 12px; font-family: var(--hand); font-size: 14px; cursor: pointer; line-height: 1.4;
    transition: all 0.12s;
  }
  .seed-list button:hover { background: var(--leaf); color: var(--paper); transform: translateX(3px); }

  .recording-area { display: flex; gap: 10px; align-items: center; margin-top: 10px; font-family: var(--mono); font-size: 11px; color: var(--ink-2); }
  .mic-btn {
    width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--ink);
    background: var(--tomato); color: var(--paper); font-size: 24px; cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink); flex-shrink: 0;
  }
  .mic-btn.recording { animation: pulse-mic 1.2s infinite; }
  @keyframes pulse-mic { 0%, 100% { box-shadow: 3px 3px 0 var(--ink), 0 0 0 0 rgba(232,93,79,0.5); } 50% { box-shadow: 3px 3px 0 var(--ink), 0 0 0 14px rgba(232,93,79,0); } }

  /* ── Step 2: scene cards ───────────────────── */
  .scene-grid { display: grid; gap: 14px; }
  .scene-card {
    border: 2px solid var(--ink); border-radius: 14px; background: var(--paper-2);
    padding: 18px; box-shadow: 3px 3px 0 var(--ink);
  }
  .scene-card .scene-no {
    display: inline-block; background: var(--ink); color: var(--paper);
    padding: 2px 10px; border-radius: 999px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; margin-bottom: 10px;
  }
  .scene-card .scene-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .scene-card .scene-text { font-size: 14px; line-height: 1.6; color: var(--ink-2); margin-bottom: 12px; }
  .prompt-card {
    background: var(--paper); border: 2px dashed rgba(26,34,51,0.3); border-radius: 10px;
    padding: 12px 14px; font-family: var(--hand); font-size: 15px; line-height: 1.7; color: var(--ink); position: relative;
  }
  .prompt-card .copy-btn {
    position: absolute; top: 8px; right: 8px; padding: 4px 10px; background: var(--ink); color: var(--paper);
    border: none; border-radius: 6px; font-family: var(--mono); font-size: 11px; cursor: pointer;
  }
  .prompt-card .copy-btn:hover { background: var(--leaf); }
  .prompt-card .copy-btn.copied { background: var(--leaf); }

  /* ── Step 3: external AI links + image upload ── */
  .ai-tools-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
  @media (max-width: 800px) { .ai-tools-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 480px) { .ai-tools-grid { grid-template-columns: 1fr; } }
  .ai-tool-card {
    padding: 16px; border: 2px solid var(--ink); border-radius: 14px; background: var(--paper-2);
    text-align: center; box-shadow: 3px 3px 0 var(--ink); display: flex; flex-direction: column; gap: 8px; align-items: center;
  }
  .ai-tool-card .tool-icon { font-size: 32px; line-height: 1; }
  .ai-tool-card .tool-name { font-size: 16px; font-weight: 700; }
  .ai-tool-card .tool-desc { font-size: 12px; color: var(--ink-2); line-height: 1.4; }
  .ai-tool-card a {
    margin-top: 6px; padding: 8px 14px; background: var(--ink); color: var(--paper);
    border-radius: 999px; font-size: 12px; font-family: var(--mono); text-decoration: none; letter-spacing: 0.06em;
  }
  .ai-tool-card a:hover { background: var(--leaf); }

  .upload-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 700px) { .upload-row { grid-template-columns: 1fr; } }
  .upload-cell {
    border: 2px dashed rgba(26,34,51,0.4); border-radius: 14px; padding: 14px; background: var(--paper-2);
    display: flex; flex-direction: column; gap: 10px;
  }
  .upload-cell .scene-no { display: inline-block; background: var(--ink); color: var(--paper); padding: 2px 10px; border-radius: 999px; font-family: var(--mono); font-size: 11px; align-self: flex-start; }
  .upload-zone {
    aspect-ratio: 4/3; background: var(--paper); border: 2px dashed rgba(26,34,51,0.3); border-radius: 10px;
    display: grid; place-items: center; cursor: pointer; position: relative; overflow: hidden;
  }
  .upload-zone:hover { background: var(--leaf-light); border-color: var(--leaf); }
  .upload-zone.has-image { border-style: solid; border-color: var(--ink); padding: 0; }
  .upload-zone img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .upload-zone .ph { font-family: var(--mono); font-size: 11px; color: var(--ink-2); text-align: center; padding: 20px; }
  .upload-zone .ph .em { font-size: 28px; display: block; margin-bottom: 6px; }
  .upload-cell input[type="file"] { display: none; }
  .upload-cell .actions { display: flex; gap: 6px; }
  .upload-cell .actions button { flex: 1; padding: 6px 8px; font-size: 12px; font-family: var(--mono); border: 1.5px solid var(--ink); background: var(--paper); border-radius: 6px; cursor: pointer; }
  .upload-cell .actions button:hover { background: var(--ink); color: var(--paper); }

  /* ── Step 4: book ─────────────────────────── */
  .book-spread {
    background: var(--paper-2); border: 3px solid var(--ink); border-radius: 18px;
    box-shadow: 6px 6px 0 var(--ink); padding: 24px; position: relative;
  }
  .book-spread::before, .book-spread::after {
    content: ''; position: absolute; top: 10%; bottom: 10%; width: 1px;
    background: rgba(26,34,51,0.2);
  }
  .book-spread::before { left: 50%; }
  .page-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  @media (max-width: 800px) { .page-grid { grid-template-columns: 1fr; } .book-spread::before { display: none; } }
  .page {
    display: flex; flex-direction: column; gap: 12px; padding: 8px;
  }
  .page .page-no { font-family: var(--mono); font-size: 11px; color: var(--ink-2); letter-spacing: 0.1em; }
  .page-img {
    aspect-ratio: 4/3; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden;
    background: repeating-linear-gradient(45deg, rgba(0,0,0,0.04), rgba(0,0,0,0.04) 8px, transparent 8px, transparent 16px), var(--paper);
    display: grid; place-items: center;
  }
  .page-img img { width: 100%; height: 100%; object-fit: cover; }
  .page-text { font-size: 15px; line-height: 1.7; }
  .page-img .ph { font-family: var(--mono); font-size: 11px; color: var(--ink-2); text-align: center; padding: 18px; }

  @media print {
    body { background: white; }
    .stage { max-width: none; padding: 0; }
    .topbar, .stepper, .nav, .footer-tip, .head .teacher-note { display: none; }
    .body { border: none; padding: 0; }
    .lesson-box { display: none; }
  }

  .style-pick { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .style-pick .chip .em { display: block; font-size: 22px; line-height: 1; margin-bottom: 4px; }

  /* ── Play Mode ─────────────────────────── */
  .play-overlay {
    position: fixed; inset: 0; background: #0a0e1a; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; gap: 20px;
  }
  .play-stage {
    position: relative; width: min(92vw, 1100px); aspect-ratio: 16/10;
    background: #000; border-radius: 18px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.08);
  }
  .play-page {
    position: absolute; inset: 0; opacity: 0; transition: opacity 0.9s ease;
    pointer-events: none;
  }
  .play-page.on { opacity: 1; pointer-events: auto; }
  .play-img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  }
  .play-img.play-ph {
    display: grid; place-items: center; color: #fff8; font-family: var(--mono); font-size: 14px;
    background: repeating-linear-gradient(45deg, #1a2233, #1a2233 12px, #0e1422 12px, #0e1422 24px);
  }
  /* Ken Burns: gentle zoom + pan, only on active page */
  @keyframes kenburns {
    0%   { transform: scale(1.05) translate(0, 0); }
    50%  { transform: scale(1.14) translate(-1.5%, -1%); }
    100% { transform: scale(1.20) translate(1.5%, 1.5%); }
  }
  .play-img.kenburns { animation: kenburns 14s ease-in-out infinite alternate; }
  .play-caption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 28px 36px 32px;
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.85) 60%);
    color: #fff;
  }
  .play-cap-title {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em;
    color: #ffd966; margin-bottom: 8px;
  }
  .play-cap-text {
    font-size: clamp(18px, 2.4vw, 26px); line-height: 1.6; font-weight: 500;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    text-wrap: pretty;
  }
  .play-progress {
    position: absolute; top: 18px; left: 18px; right: 18px;
    display: flex; gap: 6px;
  }
  .play-progress span {
    flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.18);
    transition: background 0.4s;
  }
  .play-progress span.on { background: #ffd966; }
  .play-meta {
    position: absolute; top: 38px; left: 18px; right: 18px;
    display: flex; justify-content: space-between;
    color: rgba(255,255,255,0.6); font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.08em;
  }
  .play-controls {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
  }
  .play-controls .btn {
    background: #1a2233; color: #fff; border-color: #2a3548;
    box-shadow: 3px 3px 0 #000;
  }
  .play-controls .btn:hover { background: #243049; }
  .play-controls .btn.primary { background: #ffd966; color: #1a2233; border-color: #1a2233; }
  .play-controls .btn:disabled { opacity: 0.4; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <rect width="200" height="200" fill="#fff3dc"/>
    <rect x="40" y="50" width="120" height="100" rx="6" fill="#fffaf0" stroke="#1a2233" stroke-width="3"/>
    <rect x="46" y="56" width="50" height="88" fill="#d4ecd9" stroke="#1a2233" stroke-width="2"/>
    <rect x="104" y="56" width="50" height="88" fill="#cbe7f0" stroke="#1a2233" stroke-width="2"/>

    <text x="100" y="180" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1a2233">AI 環保繪本</text>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useEffect } = React;

const TWEAKS_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showTeacherNote": true,
  "artStyle": "watercolor"
}/*EDITMODE-END*/;

// ── Persistent state hook ──────────────────────
// localStorage-backed useState. Survives page refresh.
// Skips writing when the value is the initial value (avoid clobbering on first mount).
const STORAGE_KEY = 'eco-book-state-v1';
function loadStored() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}
function saveStored(patch) {
  try {
    const cur = loadStored();
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...cur, ...patch }));
  } catch (e) {
    // localStorage full (likely scenes with big base64 images/voice). Try without media.
    if (patch.scenes) {
      try {
        const slim = patch.scenes.map(s => ({ ...s, image: null, voice: null }));
        const cur = loadStored();
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...cur, ...patch, scenes: slim, _imagesDropped: true }));
      } catch {}
    }
  }
}
function useStoredState(key, initial) {
  const [val, setVal] = useState(() => {
    const stored = loadStored();
    return key in stored ? stored[key] : initial;
  });
  useEffect(() => { saveStored({ [key]: val }); }, [key, val]);
  return [val, setVal];
}
function clearStored() { try { localStorage.removeItem(STORAGE_KEY); } catch {} }

// ── Voice recording hook ──────────────────────
function useVoiceRecorder(onDone) {
  const [recording, setRecording] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const recRef = useRef(null);
  const streamRef = useRef(null);
  const startRef = useRef(0);
  const tickRef = useRef(null);

  async function start() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      streamRef.current = stream;
      const mimes = ['audio/webm; codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
      const mime = mimes.find(m => MediaRecorder.isTypeSupported(m)) || '';
      const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
      recRef.current = rec;
      const chunks = [];
      rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      rec.onstop = () => {
        const blob = new Blob(chunks, { type: mime || 'audio/webm' });
        const reader = new FileReader();
        reader.onload = () => onDone(reader.result);
        reader.readAsDataURL(blob);
        stream.getTracks().forEach(t => t.stop());
        if (tickRef.current) clearInterval(tickRef.current);
      };
      rec.start();
      startRef.current = Date.now();
      setElapsed(0);
      tickRef.current = setInterval(() => {
        setElapsed(((Date.now() - startRef.current) / 1000));
      }, 100);
      setRecording(true);
    } catch (e) {
      alert('無法存取麥克風：' + (e.message || e) + '\n\n請允許瀏覽器使用麥克風。');
    }
  }
  function stop() {
    if (recRef.current && recRef.current.state !== 'inactive') {
      recRef.current.stop();
    }
    setRecording(false);
  }
  useEffect(() => () => {
    if (recRef.current && recRef.current.state !== 'inactive') recRef.current.stop();
    if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    if (tickRef.current) clearInterval(tickRef.current);
  }, []);
  return { recording, elapsed, start, stop };
}

// ── Speech recognition hook (for story input) ──
function useSpeech(lang, onText) {
  const [listening, setListening] = useState(false);
  const recRef = useRef(null);
  const supported = !!(window.SpeechRecognition || window.webkitSpeechRecognition);

  function start() {
    if (!supported) {
      alert('您的瀏覽器不支援語音輸入，建議用 Chrome 或 Edge。');
      return;
    }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR();
    rec.lang = lang;
    rec.continuous = true;
    rec.interimResults = false;
    rec.onresult = (e) => {
      let text = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) text += e.results[i][0].transcript;
      }
      if (text) onText(text);
    };
    rec.onerror = (e) => {
      if (e.error === 'not-allowed') alert('請允許瀏覽器使用麥克風。');
      setListening(false);
    };
    rec.onend = () => setListening(false);
    rec.start();
    recRef.current = rec;
    setListening(true);
  }
  function stop() {
    if (recRef.current) try { recRef.current.stop(); } catch {}
    setListening(false);
  }
  useEffect(() => () => { if (recRef.current) try { recRef.current.stop(); } catch {} }, []);
  return { listening, supported, start, stop };
}

async function callClaude(prompt) {
  // Prefer platform Claude if available (when running in Octomind)
  if (window.claude && window.claude.complete) {
    return window.claude.complete(prompt);
  }
  // Fall back to Gemini (free API key from Google AI Studio)
  const key = (localStorage.getItem('GEMINI_KEY') || '').trim();
  if (!key) {
    throw new Error('NEED_KEY');
  }
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(key)}`;
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }),
  });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error('Gemini error: ' + txt.slice(0, 200));
  }
  const data = await res.json();
  return data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
}

      <div className="nav">
        <button className="btn" onClick={prev}>← 回去看 Prompt</button>
        <button className="btn primary big" onClick={next}>下一步 → 組繪本</button>
      </div>
    </>
  );
}

function SceneUpload({ scene, index, setSceneImage, copyPrompt, copied }) {
  const inputRef = useRef(null);
  function handleFile(e) {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => setSceneImage(index, ev.target.result);
    reader.readAsDataURL(f);
  }
  return (
    <div className="upload-cell">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8 }}>
        <span className="scene-no">畫面 {index + 1}</span>
        <button onClick={() => copyPrompt(scene.prompt, index)} style={{ border: '1.5px solid var(--ink)', background: copied ? 'var(--leaf)' : 'var(--paper)', color: copied ? 'var(--paper)' : 'var(--ink)', padding: '4px 10px', borderRadius: 6, fontSize: 11, fontFamily: 'var(--mono)', cursor: 'pointer' }}>
          {copied ? '✓ 已複製 Prompt' : '📋 複製 Prompt'}
        </button>
      </div>
      <div style={{ fontSize: 13, color: 'var(--ink-2)', lineHeight: 1.4 }}>{scene.title}</div>
      <div className={`upload-zone ${scene.image ? 'has-image' : ''}`} onClick={() => inputRef.current?.click()}>
        {scene.image ? (
          <img src={scene.image} alt={`scene ${index + 1}`} />
        ) : (
          <div className="ph">
            <span className="em">🖼️</span>
            點這裡上傳<br/>AI 畫好的圖
          </div>
        )}
        <input ref={inputRef} type="file" accept="image/*" onChange={handleFile} />

    </div>
  );
}

// ── Play Mode ─────────────────────────────────
function PlayMode({ scenes, kidName, onClose }) {
  const [page, setPage] = useState(0);
  const [playing, setPlaying] = useState(true);
  const [voiceOn, setVoiceOn] = useState(true);
  const utterRef = React.useRef(null);
  const timerRef = React.useRef(null);

  const scene = scenes[page];

  // Pick a Chinese voice if available
  const [voice, setVoice] = useState(null);
  React.useEffect(() => {
    if (typeof speechSynthesis === 'undefined') return;
    function pick() {
      const vs = speechSynthesis.getVoices();
      const v = vs.find(x => /zh-TW|cmn-Hant/i.test(x.lang))
             || vs.find(x => /zh|cmn|Chinese|Mandarin/i.test(x.lang + x.name))
             || vs[0] || null;
      setVoice(v);
    }
    pick();
    speechSynthesis.onvoiceschanged = pick;
    return () => { speechSynthesis.onvoiceschanged = null; };
  }, []);

  const audioRef = React.useRef(null);

  function speak(text, voiceUrl, onEnd) {
    let done = false;
    const finish = () => { if (done) return; done = true; onEnd(); };

    // Priority 1: kid's own recording
    if (voiceOn && voiceUrl) {
      try {
        if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
        const audio = new Audio(voiceUrl);
        audioRef.current = audio;
        audio.onended = finish;
        audio.onerror = finish;
        audio.play().catch(finish);
        // safety net
        timerRef.current = setTimeout(finish, Math.max(15000, text.length * 600));
        return;
      } catch { /* fall through to TTS */ }
    }

    if (!voiceOn || typeof SpeechSynthesisUtterance === 'undefined') {
      // No voice: read time based on length (300ms per char, min 4.5s)
      timerRef.current = setTimeout(finish, Math.max(4500, text.length * 300));
      return;
    }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (voice) u.voice = voice;
    u.lang = 'zh-TW';
    u.rate = 0.85;
    u.pitch = 1.05;
    u.onend = finish;
    u.onerror = finish;
    utterRef.current = u;
    speechSynthesis.speak(u);
    // Generous safety net (only kicks in if onend never fires)
    timerRef.current = setTimeout(finish, Math.max(12000, text.length * 600));
  }

  function stopAll() {
    if (typeof speechSynthesis !== 'undefined') speechSynthesis.cancel();
    if (audioRef.current) { try { audioRef.current.pause(); } catch {} audioRef.current = null; }
    if (timerRef.current) clearTimeout(timerRef.current);
  }

  // page advancement
  React.useEffect(() => {
    if (!playing || !scene) return;
    stopAll();
    speak(scene.text || '', scene.voice, () => {
      // small pause then advance
      timerRef.current = setTimeout(() => {
        setPage(p => {
          if (p < scenes.length - 1) return p + 1;
          setPlaying(false);
          return p;
        });
      }, 1400);
    });
    return stopAll;
  }, [page, playing, voiceOn]);

  React.useEffect(() => () => stopAll(), []);

  function togglePlay() {
    if (playing) {
      stopAll();
      setPlaying(false);
    } else {
      // if at end, restart
      if (page >= scenes.length - 1) setPage(0);
      setPlaying(true);
    }
  }

  return (
    <div className="play-overlay">
      <div className="play-stage">
        {scenes.map((s, i) => (
          <div key={i} className={`play-page ${i === page ? 'on' : i < page ? 'past' : 'future'}`}>
            {s.image ? (
              <img src={s.image} alt={s.title} className={`play-img ${i === page && playing ? 'kenburns' : ''}`} />
            ) : (
              <div className="play-img play-ph">🖼️ 還沒上傳這張</div>
            )}
            <div className="play-caption">
              <div className="play-cap-title">{s.title}</div>
              <div className="play-cap-text">{s.text}</div>
            </div>
          </div>
        ))}

        <div className="play-progress">
          {scenes.map((_, i) => (
            <span key={i} className={i <= page ? 'on' : ''} />
          ))}
        </div>

        <div className="play-meta">
          <span>{kidName || '小朋友'} · {scenes[0]?.title || '我的繪本'}</span>
          <span>第 {page + 1} / {scenes.length} 頁</span>
        </div>
      </div>

      <div className="play-controls">
        <button className="btn" onClick={() => { stopAll(); setPage(p => Math.max(0, p - 1)); }} disabled={page === 0}>← 上一頁</button>
        <button className="btn primary big" onClick={togglePlay}>
          {playing ? '⏸ 暫停' : (page >= scenes.length - 1 ? '↻ 重新播' : '▶ 播放')}
        </button>
        <button className="btn" onClick={() => { stopAll(); setPage(p => Math.min(scenes.length - 1, p + 1)); }} disabled={page >= scenes.length - 1}>下一頁 →</button>
        <button className="btn" onClick={() => setVoiceOn(v => !v)}>{voiceOn ? '🔊 朗讀中' : '🔇 靜音'}</button>
        <button className="btn" onClick={() => { stopAll(); onClose(); }}>✕ 關閉</button>
      </div>
    </div>
  );
}

// ── Step 4 ────────────────────────────────────
const VIDEO_SECONDS_PER_SCENE = 5;
const VIDEO_W = 1280;
const VIDEO_H = 720;

async function exportVideo(scenes, kidName, onProgress) {
  // Pick the best supported MIME — prefer mp4, fall back to webm
  const mimeOptions = [
    'video/mp4; codecs=avc1.42E01E',
    'video/mp4',
    'video/webm; codecs=vp9',
    'video/webm; codecs=vp8',
    'video/webm',
  ];
  const mimeType = mimeOptions.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!mimeType) throw new Error('您的瀏覽器不支援影片錄製，請改用 Chrome 或 Edge');

  const canvas = document.createElement('canvas');
  canvas.width = VIDEO_W; canvas.height = VIDEO_H;
  const ctx = canvas.getContext('2d');

  // Pre-load all scene images
  onProgress?.('載入圖片…');
  const imgs = await Promise.all(scenes.map(s => {
    if (!s.image) return null;
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = s.image;
    });
  }));

  function drawScene(i, t) {
    const s = scenes[i];
    const img = imgs[i];
    // Background
    ctx.fillStyle = '#fffaf0';
    ctx.fillRect(0, 0, VIDEO_W, VIDEO_H);
    // Decorative border
    ctx.strokeStyle = '#1a2233';
    ctx.lineWidth = 6;
    ctx.strokeRect(40, 40, VIDEO_W - 80, VIDEO_H - 80);

    // Image area: top 60% of canvas
    const imgBoxX = 80, imgBoxY = 80, imgBoxW = VIDEO_W - 160, imgBoxH = 420;
    if (img) {
      const aspect = img.width / img.height;
      const boxAspect = imgBoxW / imgBoxH;
      let dw, dh;
      if (aspect > boxAspect) { dw = imgBoxW; dh = dw / aspect; }
      else { dh = imgBoxH; dw = dh * aspect; }
      // Subtle Ken Burns zoom (1.0 → 1.05 over scene duration)
      const zoom = 1 + 0.05 * t;
      const zw = dw * zoom, zh = dh * zoom;
      ctx.drawImage(img, imgBoxX + (imgBoxW - zw) / 2, imgBoxY + (imgBoxH - zh) / 2, zw, zh);
    } else {
      ctx.fillStyle = '#f0e6d2';
      ctx.fillRect(imgBoxX, imgBoxY, imgBoxW, imgBoxH);
      ctx.fillStyle = '#999';
      ctx.font = '32px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('（這頁沒有圖）', VIDEO_W / 2, imgBoxY + imgBoxH / 2);
    }

    // Title
    ctx.fillStyle = '#1a2233';
    ctx.font = 'bold 44px "Microsoft JhengHei", "PingFang TC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(s.title || '', VIDEO_W / 2, 560);

    // Text — wrap by character
    ctx.font = '26px "Microsoft JhengHei", "PingFang TC", sans-serif';
    ctx.fillStyle = '#4a5568';
    const text = s.text || '';
    const maxWidth = VIDEO_W - 200;
    let line = '';
    let y = 610;
    for (const ch of text) {
      const test = line + ch;
      if (ctx.measureText(test).width > maxWidth) {
        ctx.fillText(line, VIDEO_W / 2, y);
        line = ch; y += 36;
        if (y > 670) break;
      } else {
        line = test;
      }
    }
    if (line) ctx.fillText(line, VIDEO_W / 2, y);

    // Page indicator (bottom right)
    ctx.font = '18px sans-serif';
    ctx.fillStyle = '#999';
    ctx.textAlign = 'right';
    ctx.fillText(`${i + 1} / ${scenes.length} · ${kidName || '小朋友'}的環保繪本`, VIDEO_W - 80, VIDEO_H - 60);
  }

  // First frame so the stream has something
  drawScene(0, 0);

  // Audio: decode each scene's voice (if any) and figure out per-scene duration
  onProgress?.('準備聲音…');
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const audioBuffers = await Promise.all(scenes.map(async s => {
    if (!s.voice) return null;
    try {
      const res = await fetch(s.voice);
      const buf = await res.arrayBuffer();
      return await audioCtx.decodeAudioData(buf);
    } catch (e) {
      console.warn('解碼錄音失敗', e);
      return null;
    }
  }));
  // Each scene plays for: max(default seconds, audio duration + 0.6s pad)
  const durations = scenes.map((_, i) => {
    if (audioBuffers[i]) return Math.max(VIDEO_SECONDS_PER_SCENE, audioBuffers[i].duration + 0.6);
    return VIDEO_SECONDS_PER_SCENE;
  });

  // Build combined stream: canvas video + audio
  const videoStream = canvas.captureStream(30);
  const audioDest = audioCtx.createMediaStreamDestination();
  const tracks = [...videoStream.getVideoTracks()];
  const hasAnyAudio = audioBuffers.some(Boolean);
  if (hasAnyAudio) tracks.push(...audioDest.stream.getAudioTracks());
  const combinedStream = new MediaStream(tracks);

  const recorder = new MediaRecorder(combinedStream, { mimeType, videoBitsPerSecond: 2_000_000 });
  const chunks = [];
  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

  const stopped = new Promise(resolve => { recorder.onstop = resolve; });
  recorder.start(200);

  // Schedule audio playback aligned to scene start times
  if (hasAnyAudio) {
    const audioStart = audioCtx.currentTime + 0.05;
    let cum = 0;
    for (let i = 0; i < scenes.length; i++) {
      if (audioBuffers[i]) {
        const src = audioCtx.createBufferSource();
        src.buffer = audioBuffers[i];
        src.connect(audioDest);
        src.start(audioStart + cum);
      }
      cum += durations[i];
    }
  }

  // Render each scene for its duration, redrawing every frame for Ken Burns
  for (let i = 0; i < scenes.length; i++) {
    const dur = durations[i];
    onProgress?.(`錄製第 ${i + 1} / ${scenes.length} 頁（${dur.toFixed(1)} 秒${audioBuffers[i] ? ' · 含錄音' : ''}）…`);
    const start = performance.now();
    while (true) {
      const elapsed = (performance.now() - start) / 1000;
      const t = Math.min(1, elapsed / dur);
      drawScene(i, t);
      if (elapsed >= dur) break;
      await new Promise(r => requestAnimationFrame(r));
    }
  }
  recorder.stop();
  await stopped;
  try { audioCtx.close(); } catch {}

  const blob = new Blob(chunks, { type: mimeType });
  const ext = mimeType.startsWith('video/mp4') ? 'mp4' : 'webm';
  return { blob, ext, mimeType };
}

function Step4({ story, scenes, setSceneField, kidName, showNote, prev, restart }) {
  const [playing, setPlaying] = useState(false);
  const [exporting, setExporting] = useState(false);
  const [videoExporting, setVideoExporting] = useState(false);
  const [videoStatus, setVideoStatus] = useState('');

  async function exportBook() {
    setExporting(true);
    try {
      // Build a fully self-contained HTML viewer
      const data = {
        title: scenes[0]?.title || '我的環保繪本',
        author: kidName || '小朋友',
        date: new Date().toLocaleDateString('zh-TW'),
        scenes: scenes.map(s => ({ title: s.title, text: s.text, image: s.image || '', voice: s.voice || '' })),
      };
      const html = buildBookHtml(data);
      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${data.author}的環保繪本.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } finally {
      setExporting(false);
    }
  }

  async function exportMP4() {
    setVideoExporting(true);
    setVideoStatus('準備中…');
    try {
      const { blob, ext } = await exportVideo(scenes, kidName, msg => setVideoStatus(msg));
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${kidName || '小朋友'}的環保繪本.${ext}`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      setVideoStatus(ext === 'mp4' ? '✓ 完成！' : '✓ 完成！（webm 格式，可上傳到 LINE/YouTube）');
      setTimeout(() => setVideoStatus(''), 4000);
    } catch (e) {
      alert('匯出影片失敗：' + (e.message || e));
      setVideoStatus('');
    } finally {
      setVideoExporting(false);
    }
  }

  return (
    <>
      <div className="head">
        <div>
          <h2>④ 組繪本 · 你的環保繪本完成了！</h2>
          <div className="lede">恭喜！你說的故事 + AI 畫的圖 = 一本只有你能做出來的繪本。可以印出來貼牆上、念給家人聽。</div>
        </div>
        <TeacherNote show={showNote}>收尾：請小朋友念自己的繪本給全班聽。問：「AI 畫的跟你想的一樣嗎？哪邊不一樣？」</TeacherNote>
      </div>

      <div className="book-spread">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 18 }}>
          <div>
            <div style={{ fontFamily: 'var(--mono)', fontSize: 11, opacity: 0.6, letterSpacing: '0.1em' }}>MY ECO PICTURE BOOK · 我的環保繪本</div>
            <h2 style={{ margin: 0, fontSize: 24 }}>{scenes[0]?.title || '我的故事'}</h2>
          </div>
          <div style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-2)' }}>
            作者：{kidName || '小朋友'} · {new Date().toLocaleDateString('zh-TW')}
          </div>
        </div>

        <div className="page-grid">
          {scenes.map((s, i) => (
            <div key={i} className="page">
              <div className="page-no">PAGE · {i + 1} / {scenes.length}</div>
              <div className="page-img">
                {s.image ? <img src={s.image} alt={s.title} /> : (
                  <div className="ph">
                    <div style={{ fontSize: 28, marginBottom: 6 }}>🖼️</div>
                    （還沒上傳這張）
                  </div>
                )}
              </div>
              <div className="page-text">{s.text}</div>
              <VoiceRecorder voice={s.voice} onChange={(v) => setSceneField(i, 'voice', v)} />
            </div>
          ))}
        </div>

        <div className="lesson-box" style={{ marginTop: 14, fontSize: 13 }}>
          🎤 <strong>每一頁都可以錄音</strong>：小朋友念故事，按 ⏺ 停止。錄好後匯出 MP4 就會有自己的聲音！</div>
      </div>

      <div className="lesson-box">
        <strong>今天我們學到的：</strong> ① 故事是「我」的，AI 是工具 ② 給 AI 越清楚的 Prompt，畫越準 ③ AI 會畫錯，我們要看一看 ④ AI 不會搶走「想故事」的能力。
      </div>

      <div className="nav">
        <button className="btn" onClick={prev}>← 回去上傳圖</button>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
          <button className="btn primary big" onClick={() => setPlaying(true)} disabled={scenes.every(s => !s.image)}>📽️ 播放繪本</button>
          <button className="btn" onClick={exportMP4} disabled={videoExporting || scenes.length === 0}>
            {videoExporting ? `🎬 ${videoStatus || '錄製中…'}` : '🎬 匯出影片（MP4）'}
          </button>
          <button className="btn" onClick={exportBook} disabled={exporting || scenes.length === 0}>
            {exporting ? '打包中…' : '📦 匯出繪本'}
          </button>
          <button className="btn" onClick={() => window.print()}>🖨️ 列印</button>
          <button className="btn" onClick={restart}>🔄 換個小朋友</button>
        </div>
      </div>
      {videoStatus && !videoExporting ? (
        <div style={{ textAlign: 'center', marginTop: 10, fontFamily: 'var(--mono)', fontSize: 12, color: 'var(--leaf)' }}>{videoStatus}</div>
      ) : null}
      {playing ? <PlayMode scenes={scenes} kidName={kidName} onClose={() => setPlaying(false)} /> : null}
    </>
  );
}

// ── App ──────────────────────────────────────
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAKS_DEFAULTS);
  const [step, setStep] = useStoredState('step', 0);
  const [kidName, setKidName] = useStoredState('kidName', '');
  const [story, setStory] = useStoredState('story', '');
  const [artStyle, setArtStyle] = useStoredState('artStyle', tweaks.artStyle);
  const [pageCount, setPageCount] = useStoredState('pageCount', 4);
  const [scenes, setScenes] = useStoredState('scenes', []); // {title, text, prompt, image, voice}
  const [busy, setBusy] = useState(false);
  const [regeneratingIndex, setRegeneratingIndex] = useState(null);
  const [copiedIndex, setCopiedIndex] = useState(null);
  const [needKey, setNeedKey] = useState(!hasAI());
  const [showKey, setShowKey] = useState(false);

  const styleZh = ART_STYLES.find(s => s.id === artStyle)?.zh || ART_STYLES[0].zh;

  // Warn if images were dropped due to localStorage being full
  const [imagesDropped, setImagesDropped] = useState(() => loadStored()._imagesDropped || false);
  useEffect(() => {
    if (imagesDropped) {
      saveStored({ _imagesDropped: false });
      setTimeout(() => setImagesDropped(false), 8000);
    }
  }, []);

  async function generateScenes() {
    setBusy(true);
    const N = pageCount;
    const flowHint = N <= 4 ? '開始→經過→轉折→結尾'
                  : N === 6 ? '開始→發現問題→嘗試→挫折→轉機→美好結局'
                  : '開頭→介紹角色→發現問題→嘗試→挫折→轉機→行動→結局';
    const prompt = `你是幫台灣國小小朋友把故事拆成繪本的助手。閱讀這個故事，把它拆成 ${N} 個畫面，每個畫面配一個能餵給「圖像生成 AI」的繁體中文 prompt（小朋友看不懂英文，所以全部用繁體中文）。

⚠️ 語言要求（很重要）：
- 全部使用「繁體中文」（台灣正體），絕對不要用簡體字
- 用台灣用語，例如「電腦」不是「計算機」、「影片」不是「視頻」、「網路」不是「網絡」、「資料」不是「數據」、「品質」不是「質量」

故事原文：
"""
${story}
"""

繪本風格：${styleZh}

要求：
- 拆成正好 ${N} 個畫面（${flowHint}）
- 每個畫面要有：標題（繁體中文，6 字內）、文字（給繪本頁面的繁體中文敘述，30-50 字）、prompt（全部用繁體中文寫，給圖像 AI 的具體描述，包含風格 "${styleZh}"、構圖、主體、背景、光線、氛圍）
- prompt 用小朋友看得懂的簡單繁體中文，像「一隻小海龜在乾淨的海裡游泳，水彩風，陽光暖暖的，畫面很溫柔」這樣，用逗號分隔關鍵字
- 嚴格回傳純 JSON，不要 markdown、不要說明文字
- 格式：
{"scenes":[{"title":"...","text":"...","prompt":"..."}, ...${N} 個]}`;
    try {
      let raw = await callClaude(prompt);
      raw = raw.trim().replace(/^```(json)?/i, '').replace(/```$/, '').trim();
      const data = JSON.parse(raw);
      const newScenes = (data.scenes || []).slice(0, N).map(s => ({ ...s, image: null, voice: null }));
      setScenes(newScenes);
    } catch (e) {
      if (String(e.message || '').includes('NEED_KEY')) {
        setNeedKey(true);
      } else {
        // fallback — fabricate N placeholder scenes so the workflow keeps moving
        const stubs = [
          { title: '故事開始', text: story.slice(0, 50) + '…', hint: '環保故事的開頭場景，陽光溫暖' },
          { title: '事情發生', text: '故事繼續…', hint: '發生了讓人驚奇的事情' },
          { title: '發現問題', text: '主角發現了一個問題…', hint: '主角發現環境的問題' },
          { title: '嘗試解決', text: '主角想辦法解決…', hint: '主角正在思考並採取行動' },
          { title: '遇到挫折', text: '事情沒有那麼順利…', hint: '主角遇到了難關，臉上有擔心' },
          { title: '夥伴出現', text: '有人來幫忙了！', hint: '出現了幫手，畫面溫暖' },
          { title: '一起努力', text: '大家一起動手…', hint: '大家齊心協力，色彩鮮豔' },
          { title: '美好結尾', text: '一切變好了。', hint: '充滿希望的快樂結局，色彩明亮' },
        ];
        setScenes(stubs.slice(0, N).map(s => ({
          title: s.title, text: s.text,
          prompt: `${styleZh}，${s.hint}，畫面溫馨適合小朋友`,
          image: null, voice: null,
        })));
      }
    }
    setBusy(false);
  }

  function setSceneImage(i, dataUrl) {
    setScenes(prev => prev.map((s, idx) => idx === i ? { ...s, image: dataUrl } : s));
  }

  function setSceneField(i, field, value) {
    setScenes(prev => prev.map((s, idx) => idx === i ? { ...s, [field]: value } : s));
  }

  async function regenerateScene(i) {
    const target = scenes[i];
    if (!target) return;
    setRegeneratingIndex(i);
    const prompt = `你是幫台灣國小小朋友把故事拆成繪本的助手。我有一個故事，已經拆好 ${scenes.length} 個畫面，但其中「第 ${i + 1} 個畫面」需要重畫。請幫我重新生成這一個畫面就好。

⚠️ 語言要求：全部使用繁體中文（台灣正體），用台灣用語（電腦/影片/網路/資料/品質）。

故事原文：
"""
${story}
"""

目前其他畫面（請保持風格一致、敘事連貫）：
${scenes.map((s, idx) => `畫面 ${idx + 1}：${s.title} — ${s.text}`).join('\n')}

需要重做的是畫面 ${i + 1}（原本：「${target.title}」）。可以換新角度、新動作、新心情，但要接得上前後。

繪本風格：${styleZh}

要求：
- 標題（6 字內）、文字（30-50 字）、prompt（繁體中文，包含風格 "${styleZh}"、構圖、主體、背景、光線、氛圍）
- 嚴格回傳純 JSON，不要 markdown
- 格式：{"title":"...","text":"...","prompt":"..."}`;
    try {
      let raw = await callClaude(prompt);
      raw = raw.trim().replace(/^```(json)?/i, '').replace(/```$/, '').trim();
      const data = JSON.parse(raw);
      setScenes(prev => prev.map((s, idx) => idx === i
        ? { ...s, title: data.title || s.title, text: data.text || s.text, prompt: data.prompt || s.prompt }
        : s));
    } catch (e) {
      if (String(e.message || '').includes('NEED_KEY')) setNeedKey(true);
      else alert('重畫這一頁失敗：' + (e.message || e));
    }
    setRegeneratingIndex(null);
  }

  function addScene() {
    setScenes(prev => [...prev, {
      title: '新畫面',
      text: '（在這裡寫這一頁的故事…）',
      prompt: `${styleZh}，（描述這一頁要畫什麼）`,
      image: null, voice: null,
    }]);
    setPageCount(scenes.length + 1);
  }

  function deleteScene(i) {
    if (scenes.length <= 1) { alert('至少要留一個畫面。'); return; }
    if (!confirm(`刪掉第 ${i + 1} 個畫面？這個動作不能還原。`)) return;
    setScenes(prev => prev.filter((_, idx) => idx !== i));
    setPageCount(Math.max(1, scenes.length - 1));
  }

  async function copyPrompt(text, i) {
    try {
      await navigator.clipboard.writeText(text);
      setCopiedIndex(i);
      setTimeout(() => setCopiedIndex(null), 1600);
    } catch (e) {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      setCopiedIndex(i);
      setTimeout(() => setCopiedIndex(null), 1600);
    }
  }

  function restart() {
    if (!confirm('確定要清除目前的故事和圖嗎？這個動作不能還原。')) return;
    clearStored();
    setStep(0); setKidName(''); setStory(''); setScenes([]);
  }

  const canStep = useMemo(() => {
    if (story.trim().length < 8) return 0;
    if (scenes.length === 0) return 1;
    return 3;
  }, [story, scenes]);

  return (
    <div className="stage">
      <div className="topbar">
        <div className="brand">
          <div className="brand-mark">📖</div>
          <div>
            <h1>AI 環保繪本</h1>
            <div className="sub">YOUR STORY · AI'S PICTURES · 你的故事 + AI 的圖</div>
          </div>
        </div>
        <div className="right">
          <div className={`pulse ${hasAI() ? '' : 'off'}`} />
          <span>{hasAI() ? 'AI 已連線' : 'AI 未連線'}　|　💾 自動儲存</span>
          <button type="button" onClick={() => setShowKey(s => !s)} title="設定 AI 金鑰">
            ⚙ 設定
          </button>
        </div>
      </div>

      {showKey ? (
        <div style={{ padding: '0 18px', background: 'var(--paper)', borderLeft: '3px solid var(--ink)', borderRight: '3px solid var(--ink)' }}>
          <ApiKeyPanel onSaved={() => { setNeedKey(!hasAI()); }} />
        </div>
      ) : null}

      {imagesDropped ? (
        <div style={{ background: '#fbd7d0', border: '2px solid #e85d4f', borderRadius: 8, padding: '10px 14px', margin: '8px 0', fontSize: 13, color: '#1a2233' }}>
          ⚠️ 上次儲存時圖片太大裝不下，已暫時清掉圖片（文字都還在）。如果要保留圖片，建議匯出 HTML 或 MP4。
        </div>
      ) : null}

      <Stepper step={step} setStep={setStep} can={canStep} />

      <div className="body" data-screen-label={`Step ${step + 1}`}>
        {step === 0 && <Step1 story={story} setStory={setStory} kidName={kidName} setKidName={setKidName} showNote={tweaks.showTeacherNote} next={() => setStep(1)} />}
        {step === 1 && <Step2 needKey={needKey} setNeedKey={setNeedKey} story={story} scenes={scenes} setScenes={setScenes} setSceneField={setSceneField} busy={busy} generateScenes={generateScenes} regenerateScene={regenerateScene} regeneratingIndex={regeneratingIndex} addScene={addScene} deleteScene={deleteScene} pageCount={pageCount} setPageCount={setPageCount} artStyle={artStyle} setArtStyle={(v) => { setArtStyle(v); setTweak('artStyle', v); }} copiedIndex={copiedIndex} copyPrompt={copyPrompt} showNote={tweaks.showTeacherNote} prev={() => setStep(0)} next={() => setStep(2)} />}
        {step === 2 && <Step3 scenes={scenes} setSceneImage={setSceneImage} copiedIndex={copiedIndex} copyPrompt={copyPrompt} showNote={tweaks.showTeacherNote} prev={() => setStep(1)} next={() => setStep(3)} />}
        {step === 3 && <Step4 story={story} scenes={scenes} setSceneField={setSceneField} kidName={kidName} showNote={tweaks.showTeacherNote} prev={() => setStep(2)} restart={restart} />}
      </div>

      <div className="footer-tip">
        <span>FLOW</span>
        小朋友的故事 → AI 拆 Prompt → 外部 AI 畫圖 → 組成繪本
      </div>

      <TweaksPanel title="Tweaks" defaultOpen={false}>
        <TweakSection title="顯示">
          <TweakToggle
            label="顯示老師備忘"
            checked={tweaks.showTeacherNote}
            onChange={v => setTweak('showTeacherNote', v)}
          />
        </TweakSection>
        <TweakSection title="跳到步驟">
          <TweakButton onClick={() => setStep(0)}>① 說故事</TweakButton>
          <TweakButton onClick={() => setStep(1)}>② 拆 Prompt</TweakButton>
          <TweakButton onClick={() => setStep(2)}>③ 外部 AI 畫圖</TweakButton>
          <TweakButton onClick={() => setStep(3)}>④ 組繪本</TweakButton>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
